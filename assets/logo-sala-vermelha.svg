<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <linearGradient id="sirenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>
    <linearGradient id="dropGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8E72" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1D2B53" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sirene / Luz de Emergência Base -->
  <g transform="translate(10, 8)" filter="url(#logoShadow)">
    <!-- Base metálica arredondada -->
    <rect x="14" y="48" width="36" height="14" rx="5" fill="#1D2B53" />
    <rect x="18" y="52" width="28" height="3" rx="1.5" fill="#48CAE4" opacity="0.6"/>

    <!-- Cúpula de luz de emergência -->
    <path d="M 18 48 C 18 26, 46 26, 46 48 Z" fill="url(#sirenGlow)" />
    <!-- Feixe / reflexo de luz -->
    <path d="M 22 46 C 22 32, 34 30, 36 30 C 34 32, 28 38, 28 46 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Raiozinhos de alerta lúdicos -->
    <line x1="8" y1="28" x2="2" y2="24" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="16" x2="9" y2="10" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="12" x2="32" y2="5" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="16" x2="55" y2="10" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="28" x2="62" y2="24" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>

    <!-- Mascote Gotinha acoplada à frente da luz -->
    <g transform="translate(26, 26)">
      <path d="M 16 2 C 16 2, 4 16, 4 24 A 12 12 0 0 0 28 24 C 28 16, 16 2, 16 2 Z" fill="url(#dropGradLogo)" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Olhos e sorriso da Gotinha -->
      <circle cx="12" cy="21" r="2" fill="#1D2B53"/>
      <circle cx="20" cy="21" r="2" fill="#1D2B53"/>
      <circle cx="12.5" cy="20.5" r="0.6" fill="#FFFFFF"/>
      <circle cx="20.5" cy="20.5" r="0.6" fill="#FFFFFF"/>
      <path d="M 13 25 Q 16 28 19 25" stroke="#1D2B53" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- Bochechas rosadas -->
      <circle cx="9" cy="23" r="1.5" fill="#FF85A1"/>
      <circle cx="23" cy="23" r="1.5" fill="#FF85A1"/>
    </g>
  </g>

  <!-- Tipografia do Logo -->
  <g transform="translate(84, 18)">
    <text x="0" y="28" font-family="'Fredoka', 'Nunito', sans-serif" font-weight="700" font-size="26" fill="#E63946" letter-spacing="-0.5">SALA VERMELHA</text>
    <text x="0" y="46" font-family="'Nunito', sans-serif" font-weight="800" font-size="12" fill="#1D2B53" letter-spacing="1.5">CHOQUE HIPOVOLÊMICO</text>
    <rect x="0" y="51" width="180" height="2" rx="1" fill="#2EC4B6" opacity="0.8"/>
  </g>
</svg>
